<div class="news-list">
  {% for item in site.data.news %}
    <div class="news-item">
      <time class="news-date">{{ item.date }}</time>
      <div class="news-text">
        {% if item.link %}<a href="{{ item.link }}">{{ item.text }}</a>{% else %}{{ item.text }}{% endif %}
      </div>
    </div>
  {% endfor %}
</div>
